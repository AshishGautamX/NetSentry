# Check Point Gaia OS clish configuration export
# Product: Check Point Quantum Security Gateway
# OS: Gaia OS R81.20

set hostname CP-GW-PRIMARY
set timezone America/New_York
set clish idle-timeout 10
set ssh server version 2
set ntp active on
add ntp server 10.10.1.5 version 4
set snmp agent on
set snmp agent-version v3-only
set aaa radius-servers on
set passwords min-length 14
set interface eth0 ipv4-address 192.168.1.1 mask-length 24
