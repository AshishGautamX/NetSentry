! Current Configuration - Cisco Catalyst 9300 / IOS-XE 17.6.3a
! Compliant baseline configuration
version 17.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
!
hostname CORE-SW-01
!
boot-start-marker
boot-end-marker
!
logging buffered 64000 informational
logging trap warnings
logging source-interface Loopback0
logging host 10.10.50.10
!
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
aaa authorization exec default local
!
ip domain-name enterprise.internal
ip name-server 10.10.1.10
!
login block-for 300 attempts 3 within 60
login on-failure log
login on-success log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-gcm aes128-gcm
!
no ip http server
ip http secure-server
ip http secure-port 443
!
banner motd ^C
***********************************************************************
* AUTHORIZED ACCESS ONLY. ALL SESSIONS MONITORED AND LOGGED.        *
* DISCONNECT IMMEDIATELY IF YOU ARE NOT AN AUTHORIZED OPERATOR.       *
***********************************************************************
^C
!
banner login ^C
***********************************************************************
* PROPRIETARY SYSTEM - SECURITY COMPLIANCE ENFORCED                   *
***********************************************************************
^C
!
security passwords min-length 14
!
snmp-server group SECUREGROUP v3 priv
snmp-server user secadmin SECUREGROUP v3 auth sha MyAuthKey123 priv aes 128 MyPrivKey456
snmp-server enable traps
no snmp-server community public
no snmp-server community private
!
ntp server 10.10.1.5 prefer
ntp authenticate
ntp trusted-key 1
!
line con 0
 exec-timeout 5 0
 transport input none
 stopbits 1
!
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 transport input ssh
 transport output none
!
line vty 5 15
 exec-timeout 5 0
 transport input ssh
 transport output none
!
end
