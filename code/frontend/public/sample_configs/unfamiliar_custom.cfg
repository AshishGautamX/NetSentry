# Custom Edge Gateway Appliance Config (Firmware v4.2-SEC)
# Device: EDGE-GW-909
system-id EDGE-GW-909
domain custom-edge.internal

# Standard recognizable parameters
ip ssh version 2
no ip http server
ip http secure-server

# Unfamiliar vendor-specific security commands for training demonstration
set security abc-session-timeout 300
set sec-profile custom-pwd-len 16
enable-custom-audit-trail yes
custom-crypto-engine sha384-strict
enable-login-banner "SECURE RESTRICTED ACCESS GATEWAY"
snmp-agent v3-only enable

# End of configuration
