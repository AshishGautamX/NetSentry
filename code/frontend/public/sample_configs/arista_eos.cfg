! Command: show running-config
! device: DC-SPINE-01 (vEOS-lab, EOS-4.28.2F)
!
! boot system flash:/EOS.swi
!
transceiver qsfp default-mode 4x10G
!
hostname DC-SPINE-01
ip domain-name dc.internal
!
banner login
******************************************************************
* RESTRICTED SYSTEM - UNAUTHORIZED USE IS STRICTLY FORBIDDEN     *
******************************************************************
EOF
!
management ssh
   protocol version 2
   idle-timeout 10
   no shutdown
!
no management telnet
!
no management api http-commands
management api http-commands
   protocol https
   no shutdown
!
aaa authentication login default local
aaa authorization exec default local
!
logging host 10.10.50.10
logging trap warnings
!
ntp server 10.10.1.5 prefer
!
snmp-server contact secops@enterprise.internal
snmp-server location DC-RACK-A4
!
end
