# Cumulus Linux Network Operating System Configuration
# Hostname: CUMULUS-LEAF-01
# OS: Cumulus Linux 5.4.0

hostname CUMULUS-LEAF-01

# Loopback Interface
auto lo
iface lo inet loopback
    address 10.255.0.1/32

# Uplink interfaces
auto swp1
iface swp1 inet static
    address 10.0.0.1/30

# FRRouting Configuration (/etc/frr/frr.conf)
frr version 8.5.1
frr defaults datacenter
service password-encryption

router bgp 65001
 bgp router-id 10.255.0.1
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 password [MASKED_PASSWORD]
 neighbor 10.0.0.2 maximum-prefix 5000

line vty
 exec-timeout 5 0
 transport input ssh

# Security directives
no ip source-route
no ip redirects
ntp server 10.10.1.5
logging host 10.10.50.10
