## Last changed: 2026-02-14 10:20:00 UTC
version 21.4R3.15;
system {
    host-name EDGE-SRX-01;
    domain-name datacenter.internal;
    time-zone UTC;
    authentication-order [ radius password ];
    login {
        message "AUTHORIZED USERS ONLY - MONITORED GATEWAY";
        retry-options {
            tries-before-disconnect 3;
            backoff-threshold 1;
            backoff-factor 5;
            minimum-time 20;
        }
        password {
            minimum-length 14;
            format sha-512;
        }
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$rounds=65600$jWq...$masked";
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
            connection-limit 5;
            rate-limit 3;
            ciphers [ aes256-gcm@openssh.com aes128-gcm@openssh.com ];
        }
        web-management {
            https {
                port 8443;
                system-generated-certificate;
            }
        }
    }
    syslog {
        archive size 100k files 3;
        user * {
            any emergency;
        }
        host 10.10.50.10 {
            any warning;
            facility-override local0;
        }
    }
    ntp {
        server 10.10.1.5;
    }
}
snmp {
    v3 {
        usm {
            local-engine {
                user secadmin {
                    authentication-sha {
                        authentication-key "$9$encrypted";
                    }
                    privacy-aes128 {
                        privacy-key "$9$encrypted";
                    }
                }
            }
        }
    }
}
