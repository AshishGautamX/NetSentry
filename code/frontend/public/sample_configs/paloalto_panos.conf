set deviceconfig system hostname PA-NGFW-01
set deviceconfig system domain enterprise.internal
set deviceconfig system ip-address 192.168.1.1 netmask 255.255.255.0
set deviceconfig system login-banner "UNAUTHORIZED ACCESS PROHIBITED - SYSTEM MONITORED"
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system service disable-ssh no
set deviceconfig system service ssh-version-2 yes
set deviceconfig setting management idle-timeout 10
set mgt-config password-complexity minimum-length 14
set mgt-config password-complexity enabled yes
set mgt-config users admin permissions role-based superuser yes
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.10.1.5
set shared log-settings syslog PROD-SYSLOG server 10.10.50.10 transport UDP port 514
