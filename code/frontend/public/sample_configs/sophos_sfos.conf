# Sophos Firewall (SFOS v19.5) Configuration Export
# Model: Sophos XGS 3300 Next-Gen Firewall

console> set system-hostname SOPHOS-CORP-FW
console> system ssh version 2
console> system ssh idle-timeout 600
console> system diagnostics password-complexity min-length 14
